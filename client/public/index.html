<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>斗十四</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
    #GameDiv { width: 100%; height: 100%; }
    #GameCanvas { width: 100%; height: 100%; touch-action: none; }
    #splash { position: absolute; inset: 0; background: #111; }
    .progress-bar { position: absolute; left: 20%; right: 20%; bottom: 15%; height: 3px; background: #444; }
    .progress-bar span { display: block; height: 100%; background: #ddd; }
    #boot-error { position: absolute; inset: 20%; color: #fff; font: 18px sans-serif; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="GameDiv"><canvas id="GameCanvas" tabindex="0"></canvas></div>
  <div id="splash"><div class="progress-bar"><span></span></div></div>
  <div id="boot-error" hidden></div>
  <script src="runtime-config.js"></script>
  <script src="edition-config.js"></script>
  <script src="decimal.js"></script>
  <script src="standalone.js"></script>
  <script src="standalone-replay.js"></script>
  <script src="cocos2d-js.js"></script>
  <script src="src/settings.js"></script>
  <script src="main.js"></script>
  <script src="start.js"></script>
</body>
</html>
